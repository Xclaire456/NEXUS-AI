<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS AI – Programmer &amp; Academic Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF1F6;--grid:#D7DEEA;--panel:#F8FAFD;--ink:#14203A;--muted:#5A6784;--line:#C9D2E3;--accent:#2A4BD7;--onaccent:#fff;--mark:#FFE27A;--code:#101A33;--codeink:#E4EAFB;--err:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--grid:#1A2440;--panel:#151E36;--ink:#E6EAF5;--muted:#93A0C0;--line:#2A3558;--accent:#8FA6FF;--onaccent:#0F1626;--mark:#6B5A12;--code:#0A101F;--codeink:#DCE4FA;--err:#FF9A92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1626;--grid:#1A2440;--panel:#151E36;--ink:#E6EAF5;--muted:#93A0C0;--line:#2A3558;--accent:#8FA6FF;--onaccent:#0F1626;--mark:#6B5A12;--code:#0A101F;--codeink:#DCE4FA;--err:#FF9A92;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:14px;overflow-y:auto}
.brand b{font-size:1.25rem;font-weight:600;letter-spacing:.01em}
.brand span{display:block;color:var(--muted);font-size:.85rem}
#modes{display:flex;flex-direction:column;gap:2px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 10px;border-radius:6px;border-left:4px solid transparent}
.mode:hover{background:var(--bg)}
.mode:focus-visible{outline:2px solid var(--accent)}
.mode strong{display:block;font-weight:500}
.mode small{color:var(--muted);font-size:.8rem}
.mode[aria-pressed="true"]{background:var(--mark);border-left-color:var(--accent)}
.mode[aria-pressed="true"] small{color:var(--ink)}
.reset{margin-top:auto;cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.reset:hover{border-color:var(--accent)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);font-size:.9rem;color:var(--muted)}
.bar b{color:var(--ink);font-weight:600}
.log{flex:1;overflow-y:auto;padding:24px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg.user{align-self:flex-end;max-width:85%;background:var(--mark);padding:8px 14px;border-radius:10px 10px 2px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 18px;overflow-wrap:anywhere}
.msg.bot p,.msg.bot ul,.msg.bot ol,.msg.bot h3,.msg.bot blockquote{margin:.7em 0}
.msg.bot h3{font-size:1.05rem;font-weight:600}
.msg.bot code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.88em;background:var(--bg);padding:1px 5px;border-radius:4px}
.msg.bot blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted)}
.msg.bot a{color:var(--accent)}
.code{margin:.8em 0;border-radius:8px;overflow:hidden;background:var(--code);color:var(--codeink)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:.78rem;border-bottom:1px solid rgba(255,255,255,.1)}
.code-h button{cursor:pointer;background:none;border:0;color:inherit;padding:2px 6px;border-radius:4px}
.code-h button:hover{background:rgba(255,255,255,.12)}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:.85rem;line-height:1.5;color:inherit}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:.9rem;margin:.8em 0}
th,td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.hello h1{font-size:1.6rem;line-height:1.25;margin:8px 0 4px;font-weight:600}
.hello p{margin:0 0 14px;color:var(--muted)}
.starters{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.starters button{cursor:pointer;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.starters button:hover{border-color:var(--accent)}
.notice{max-width:760px;margin:0 auto 10px;color:var(--err);font-size:.9rem}
.composer{padding:12px 24px 16px;border-top:1px solid var(--line);background:var(--panel)}
.row{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:180px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);line-height:1.45}
.send{cursor:pointer;background:var(--accent);color:var(--onaccent);border:0;border-radius:8px;padding:0 18px;height:44px;font-weight:500}
.send:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:760px){
.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.side{flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;gap:10px}
.brand span,.mode small{display:none}
#modes{flex-direction:row;gap:6px}
.mode{white-space:nowrap;border-left:0;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.mode[aria-pressed="true"]{border-color:var(--accent)}
.reset{margin:0;white-space:nowrap}
.bar{display:none}
.log{padding:16px 12px}.composer{padding:10px 12px 12px}
.msg.bot{padding:4px 14px}
}
.ovbar{display:none;align-items:center;justify-content:space-between;height:30px;padding:0 6px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted);-webkit-app-region:drag;user-select:none}
.ovbar button{-webkit-app-region:no-drag;cursor:pointer;background:none;border:0;font-size:1.1rem;line-height:1;padding:2px 8px;border-radius:4px;color:inherit}
.ovbar button:hover{background:var(--bg)}
.overlay body{display:flex;flex-direction:column}
.overlay .ovbar{display:flex}
.overlay .app{height:auto;flex:1;min-height:0}
.overlay .brand{display:none}
</style>
</head>
<body>
<div class="ovbar"><span>NEXUS AI &nbsp;·&nbsp; Esc untuk menyembunyikan</span><button id="ovclose" type="button" aria-label="Sembunyikan">×</button></div>
<div class="app">
<aside class="side">
<div class="brand"><b>NEXUS AI</b><span>Programmer &amp; academic mentor</span></div>
<nav id="modes" aria-label="Mode"></nav>
<button class="reset" id="reset" type="button">Percakapan baru</button>
</aside>
<main class="main">
<div class="bar" id="bar"></div>
<section class="log" id="log" aria-live="polite"></section>
<footer class="composer">
<div class="notice" id="notice" hidden></div>
<div class="row">
<textarea id="input" rows="1" placeholder="Tulis pertanyaan, kode, atau tugasmu…" aria-label="Pesan"></textarea>
<button class="send" id="send" type="button">Kirim</button>
</div>
</footer>
</main>
</div>
<script>
let MODES = [];
if (/[?&]overlay=1/.test(location.search)) document.documentElement.classList.add("overlay");

const KEY = "nexus:v1";
let state = { mode: "coding", msgs: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && Array.isArray(s.msgs)) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), notice = $("notice");
let busy = false, ctrl = null;


const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inl = s => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
  .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

function md(src) {
  const blocks = [];
  src = src.replace(/```([\w+#-]*)\n([\s\S]*?)(```|$)/g, (m, l, c) => {
    blocks.push('<div class="code"><div class="code-h"><span>' + esc(l || "kode") + '</span><button type="button" class="copy">Salin</button></div><pre><code>' + esc(c.replace(/\n$/, "")) + "</code></pre></div>");
    return "\u0001" + (blocks.length - 1) + "\u0001";
  });
  const L = src.split("\n"), out = [];
  const isList = l => /^\s*([-*]|\d+\.)\s+/.test(l);
  const starts = l => /^#{1,4}\s/.test(l) || isList(l) || /^>\s?/.test(l) || /^\s*\|/.test(l) || /^\u0001\d+\u0001$/.test(l) || /^---+$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  let i = 0;
  while (i < L.length) {
    const l = L[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^\u0001(\d+)\u0001$/))) { out.push(blocks[+m[1]]); i++; continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { out.push("<h3>" + inl(m[1]) + "</h3>"); i++; continue; }
    if (/^---+$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i + 1] || "")) {
      let t = "<div class='scroll'><table><thead><tr>" + cells(l).map(c => "<th>" + inl(c) + "</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < L.length && /^\s*\|/.test(L[i])) { t += "<tr>" + cells(L[i]).map(c => "<td>" + inl(c) + "</td>").join("") + "</tr>"; i++; }
      out.push(t + "</tbody></table></div>"); continue;
    }
    if (isList(l)) {
      const ord = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && isList(L[i])) { items.push("<li>" + inl(L[i].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>"); i++; }
      out.push((ord ? "<ol>" : "<ul>") + items.join("") + (ord ? "</ol>" : "</ul>")); continue;
    }
    if (/^>\s?/.test(l)) {
      const q = [];
      while (i < L.length && /^>\s?/.test(L[i])) { q.push(inl(L[i].replace(/^>\s?/, ""))); i++; }
      out.push("<blockquote>" + q.join("<br>") + "</blockquote>"); continue;
    }
    const p = [];
    while (i < L.length && L[i].trim() && !starts(L[i])) { p.push(inl(L[i])); i++; }
    if (!p.length) { p.push(inl(L[i])); i++; }
    out.push("<p>" + p.join("<br>") + "</p>");
  }
  return out.join("");
}

function mode() { return MODES.find(m => m.id === state.mode) || MODES[0] || { name: "", desc: "", starters: [] }; }

function renderModes() {
  const nav = $("modes");
  nav.innerHTML = "";
  MODES.forEach(m => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mode";
    b.setAttribute("aria-pressed", String(m.id === state.mode));
    b.innerHTML = "<strong>" + m.name + "</strong><small>" + m.desc + "</small>";
    b.onclick = () => { state.mode = m.id; save(); renderModes(); renderLog(); };
    nav.appendChild(b);
  });
  $("bar").innerHTML = "Mode aktif: <b>" + mode().name + "</b>. " + mode().desc + ".";
}

function renderLog() {
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  if (!state.msgs.length) {
    const m = mode();
    wrap.innerHTML = '<div class="hello"><h1>Mau belajar atau mengerjakan apa hari ini?</h1><p>Mode ' + m.name + ': ' + m.desc.toLowerCase() + '. Tempel kode atau soalmu langsung, atau mulai dari salah satu ini.</p></div>';
    const s = document.createElement("div");
    s.className = "starters";
    m.starters.forEach(t => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.onclick = () => { input.value = t; input.focus(); autosize(); }; s.appendChild(b); });
    wrap.firstChild.appendChild(s);
  } else {
    state.msgs.forEach((m, i) => {
      const d = document.createElement("div");
      d.className = "msg " + (m.role === "user" ? "user" : "bot");
      d.dataset.i = i;
      if (m.role === "user") d.textContent = m.content; else d.innerHTML = md(m.content) || "<p>…</p>";
      wrap.appendChild(d);
    });
  }
  log.innerHTML = "";
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function updateLast() {
  const el = log.querySelector('.msg.bot[data-i="' + (state.msgs.length - 1) + '"]');
  if (el) { el.innerHTML = md(state.msgs[state.msgs.length - 1].content) || "<p>…</p>"; log.scrollTop = log.scrollHeight; }
}

function say(t) { notice.textContent = t || ""; notice.hidden = !t; }

function buildInput() {
  const hist = [];
  state.msgs.slice(-20).forEach(m => {
    if (!m.content) return;
    const last = hist[hist.length - 1];
    if (last && last.role === m.role) last.content += "\n\n" + m.content; else hist.push({ role: m.role, content: m.content });
  });
  while (hist.length && hist[0].role !== "user") hist.shift();
  return hist;
}

async function stream(messages, signal, onText) {
  let res;
  try {
    res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: state.mode, messages }), signal });
  } catch (e) {
    if (signal.aborted) throw e;
    throw new Error("Server NEXUS tidak terjangkau. Pastikan server masih berjalan di terminal.");
  }
  if (!res.ok) {
    let m = "Permintaan gagal (" + res.status + ").";
    try { m = (await res.json()).error || m; } catch (e) {}
    throw new Error(m);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let k;
    while ((k = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, k).trim();
      buf = buf.slice(k + 2);
      if (!line.startsWith("data:")) continue;
      const d = JSON.parse(line.slice(5));
      if (d.error) throw new Error(d.error);
      if (d.text) onText(d.text);
    }
  }
}

function setBusy(b) { busy = b; sendBtn.textContent = b ? "Berhenti" : "Kirim"; }

async function send() {
  if (busy) { if (ctrl) ctrl.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  say("");
  input.value = ""; autosize();
  state.msgs.push({ role: "user", content: text });
  const bot = { role: "assistant", content: "" };
  const payload = buildInput();
  state.msgs.push(bot);
  renderLog(); setBusy(true);
  ctrl = new AbortController();
  try {
    await stream(payload, ctrl.signal, t => { bot.content += t; updateLast(); });
  } catch (err) {
    if (!(ctrl && ctrl.signal.aborted)) say(err && err.message ? err.message : "Pesan gagal dijawab. Kirim ulang pesanmu.");
  }
  if (!bot.content) state.msgs.pop();
  ctrl = null; setBusy(false); save(); renderLog();
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
sendBtn.onclick = send;
$("reset").onclick = () => { if (ctrl) ctrl.abort(); state.msgs = []; save(); say(""); renderLog(); };
log.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const code = b.closest(".code").querySelector("code").textContent;
  const done = () => { b.textContent = "Tersalin"; setTimeout(() => { b.textContent = "Salin"; }, 1500); };
  try { navigator.clipboard.writeText(code).then(done, fallback); } catch (x) { fallback(); }
  function fallback() { try { const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); } catch (y) {} }
});

$("ovclose").onclick = () => window.close();
renderModes(); renderLog();
fetch("/api/config").then(r => r.json()).then(c => { MODES = c.modes; renderModes(); renderLog(); }).catch(() => say("Tidak bisa memuat konfigurasi. Pastikan server berjalan."));
</script>
</body>
</html>
